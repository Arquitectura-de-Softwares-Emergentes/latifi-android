openapi: 3.0.3
info:
  title: LatiFi API
  version: 0.2.0
  description: >-
    Draft contract of the Identity/Wallet, Reputation and Exchange Rate contexts of LatiFi API, as
    described in Chapter V of the project report. Phase 4 builds the Spring controllers from this
    file and Phase 5 builds the Android clients from it.


    Conventions. Quantities that come from a uint256 (loan amounts, loan identifiers) travel as
    JSON strings of digits, in base units of the test stablecoin (6 decimals), because Kotlin and
    JavaScript clients lose precision on large integers. Timestamps are RFC 3339 date-time strings.
    Paged responses share the envelope items, page, size and totalItems. Every error body is an
    ApiError. Local currency values exist only in the exchange rate operations and are display
    only.


    Reputation. The score is an integer from 0 to 1000 and the levels use the same scale: NEW,
    BUILDING, TRUSTED and EXCELLENT. The score is derived from the indexed event log, so it can be
    recomputed at any time.


    Session. The session token lives 900 seconds (15 minutes) and there is no refresh token. When
    it expires, the wallet signs a new challenge.


    Exchange rates. Rates come from a third party. The attribution text is "Rates By Exchange Rate
    API" and the link is https://www.exchangerate-api.com.
servers:
  - url: /api/v1
    description: Base path of every operation. Paths below are written without it.
tags:
  - name: Auth
    description: Wallet signature login. No password and no key ever reaches the server.
  - name: Profiles
    description: Lightweight user profile bound to a wallet address.
  - name: Reputation
    description: Hybrid reputation score and its event history.
  - name: Loans
    description: Read model of the loans that the indexer mirrors from the chain.
  - name: ExchangeRate
    description: Display-only conversion from the stablecoin to a local currency.
security:
  - bearerAuth: []
paths:
  /auth/challenge:
    post:
      tags: [Auth]
      operationId: issueChallenge
      summary: Request a sign-in challenge for a wallet address
      description: >-
        Issues a random single-use nonce for the address. The nonce expires after 5 minutes. The
        wallet signs the returned message as an EIP-191 personal message and sends the signature to
        the verify operation. Serves US-AUTH-01 and US-AUTH-02. Listed in report section 5.2.2.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Challenge issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyChallenge
      summary: Exchange a signed challenge for a session token
      description: >-
        Accepts the challenge identifier, the declared address and the signature of the challenge
        message. The API recovers the signer and accepts only when it equals both the declared
        address and the address the challenge was issued for, and the challenge is unused and
        younger than 5 minutes. A wrong signer, a replayed challenge, an expired challenge and an
        unknown challenge all return 401, so a caller cannot tell them apart. The challenge is
        consumed on the first successful use. Serves US-AUTH-01 and US-AUTH-02. Listed in report
        section 5.2.2.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Signature accepted, session token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /profiles/{address}:
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Read the profile bound to an address
      description: >-
        Returns the display name of the profile. The read is public and the bearer token is
        optional. A call with no token returns the display name only. A call with an invalid or
        expired token still returns 401. The contact is included only when the token belongs to the
        address in the path, and it is never returned for any other address. Serves US-IDEN-02.
        Listed in report section 5.2.2.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Profiles]
      operationId: upsertProfile
      summary: Create or update the profile of the caller
      description: >-
        Creates the profile when none exists (201) and replaces it otherwise (200). Only the owner
        of the address may write, any other caller receives 403. A complete profile (name and
        contact) unlocks publishing and funding in the app. Serves US-IDEN-01 and US-IDEN-02.
        Listed in report section 5.2.2.
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: The existing profile was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '201':
          description: The profile was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reputation/{address}:
    get:
      tags: [Reputation]
      operationId: getReputation
      summary: Read the reputation of an address
      description: >-
        Returns the score (0 to 1000), the level and the counters of a borrower. An address with a
        profile but no loans yet gets the initial off-chain score. The counters are counts of
        completed installments and defaults taken from the indexed event log, not the counters of
        the contract. Serves US-REP-02 and US-API-01. Listed in report section 5.3.2.
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The reputation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /reputation/{address}/history:
    get:
      tags: [Reputation]
      operationId: getReputationHistory
      summary: List the reputation events behind a score
      description: >-
        Returns a page of reputation events, newest first, each with the transaction reference
        (txHash and logIndex) that produced it. The optional type filter serves the result chips of
        the reputation screen (on time, late, defaulted). Serves US-API-01. Listed in report
        section 5.3.2. There is no top-level history route.
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - name: type
          in: query
          required: false
          description: Keep only events of this type.
          schema:
            $ref: '#/components/schemas/ReputationEventType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: A page of reputation events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /loans:
    get:
      tags: [Loans]
      operationId: listLoans
      summary: List loans with filters and a sort order
      description: >-
        Returns a page of loans mirrored from the chain events. It feeds the lender opportunities
        feed, the borrower loan list and the lender portfolio, depending on the filters. The
        default order is reputation, highest borrower score first, so the lender reviews the safest
        requests first. Every loan carries the reputation of its borrower. No field of a loan holds
        a local currency value, the app asks the exchange rate operations for that. Serves
        US-LEND-02, US-REP-03 and US-LEND-05. Listed in report section 5.3.2 and used by the
        searching systems of report section 6.2.3. An open request has no expiry on the chain, so
        lenders filter with status=OPEN and sort with recent to see the newest first.
      parameters:
        - name: status
          in: query
          required: false
          description: Keep only loans in this state.
          schema:
            $ref: '#/components/schemas/LoanStatus'
        - name: minAmount
          in: query
          required: false
          description: Smallest principal, in stablecoin base units.
          schema:
            $ref: '#/components/schemas/Uint256'
        - name: maxAmount
          in: query
          required: false
          description: Largest principal, in stablecoin base units.
          schema:
            $ref: '#/components/schemas/Uint256'
        - name: maxTermDays
          in: query
          required: false
          description: Longest term in days.
          schema:
            type: integer
            minimum: 1
            example: 30
        - name: minLevel
          in: query
          required: false
          description: >-
            Lowest borrower reputation level to include. The levels cover the score scale of 0 to
            1000: NEW from 0, BUILDING from 400, TRUSTED from 600 and EXCELLENT from 800.
          schema:
            $ref: '#/components/schemas/ReputationLevel'
        - name: borrower
          in: query
          required: false
          description: Keep only loans requested by this address.
          schema:
            $ref: '#/components/schemas/Address'
        - name: lender
          in: query
          required: false
          description: Keep only loans funded by this address.
          schema:
            $ref: '#/components/schemas/Address'
        - name: sort
          in: query
          required: false
          description: >-
            Sort order. reputation is the borrower score, highest first. amount is the principal,
            largest first. term is the term, shortest first. rate is the interest rate, highest
            first. recent is the request time, newest first. nextDue is the next installment due
            date, soonest first.
          schema:
            type: string
            enum: [reputation, amount, term, rate, recent, nextDue]
            default: reputation
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: A page of loans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /loans/{loanId}:
    get:
      tags: [Loans]
      operationId: getLoan
      summary: Read one loan with its status and borrower reputation
      description: >-
        Returns the same LoanSummary as the list. Serves US-LEND-05. Listed in report section
        5.3.2.
      parameters:
        - $ref: '#/components/parameters/LoanIdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The loan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /exchange-rate/convert:
    get:
      tags: [ExchangeRate]
      operationId: convertAmount
      summary: Convert a stablecoin amount to a local currency
      description: >-
        Converts an amount in stablecoin base units to the requested currency using the cached
        rate. The supported currencies are PEN, COP, MXN, ARS, BRL and CLP. The stablecoin is
        treated as one US dollar, and the value is for display only: it never changes what is
        signed or stored on-chain. When the provider is down the last cached rate is served with
        status 200 and stale set to true. An unsupported currency returns 400 with the code
        UNSUPPORTED_CURRENCY and a message localized by Accept-Language. When no rate exists at all
        (the provider is down and nothing was ever cached) the response is 503 with the code
        RATE_UNAVAILABLE. Serves US-API-02 and US-LEND-06. Listed in report section 5.4.2.
      parameters:
        - name: amount
          in: query
          required: true
          description: Amount in stablecoin base units (6 decimals).
          schema:
            type: string
            pattern: '^[0-9]{1,78}$'
            example: '250000000'
        - name: currency
          in: query
          required: true
          description: ISO 4217 code of the target currency, three uppercase letters.
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
            example: PEN
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The converted value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /exchange-rate/rates:
    get:
      tags: [ExchangeRate]
      operationId: listRates
      summary: List the available rates and their age
      description: >-
        Returns one quote per supported currency with the instant of the rate and the stale flag.
        When no rate exists at all the response is 503 with the code RATE_UNAVAILABLE. The
        attribution text "Rates By Exchange Rate API" applies to these rates. Serves US-API-02.
        Listed in report section 5.4.2.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The available rates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token returned by the verify operation.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Language of error messages. BCP 47 tags such as es-419 and es-PE are accepted, and so are
        the underscore forms such as es_419 and en_US. Any Spanish range answers in es_419.
        Anything else answers in en_US, which is the default.
      schema:
        type: string
        default: en_US
    AddressPath:
      name: address
      in: path
      required: true
      description: Wallet address.
      schema:
        $ref: '#/components/schemas/Address'
    LoanIdPath:
      name: loanId
      in: path
      required: true
      description: Loan identifier assigned by the contract.
      schema:
        $ref: '#/components/schemas/Uint256'
    Page:
      name: page
      in: query
      required: false
      description: Zero based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: The request is malformed or a value is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: The bearer token is missing, invalid or expired, or the signature was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The caller does not own the address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Too many requests from this client. The implementation must rate limit.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt.
          schema:
            type: integer
            minimum: 0
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: No exchange rate is available. The code is RATE_UNAVAILABLE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Address:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
      description: Wallet address, 0x followed by 40 hex digits.
      example: '0x1111111111111111111111111111111111111111'
    Uint256:
      type: string
      pattern: '^[0-9]{1,78}$'
      description: >-
        Unsigned integer as a string of digits. For amounts it is in stablecoin base units, where
        1000000 is one token.
      example: '250000000'
    DecimalString:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: Non negative decimal number as a string, so no client rounds it.
      example: '3.7512'
    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
          description: HTTP status code of the response.
          example: 400
        code:
          type: string
          description: >-
            Stable machine readable error code. The full list is in the x-error-codes extension of
            this schema.
          example: INVALID_ADDRESS
        message:
          type: string
          description: Human readable message, localized by Accept-Language.
          example: The address is not a valid wallet address.
      x-error-codes:
        - INVALID_ADDRESS
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - UNSUPPORTED_CURRENCY
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - FORBIDDEN_NOT_OWNER
        - NOT_FOUND
        - PROFILE_NOT_FOUND
        - REPUTATION_NOT_FOUND
        - LOAN_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - UNSUPPORTED_MEDIA_TYPE
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - RATE_UNAVAILABLE
    ChallengeRequest:
      type: object
      required: [address]
      properties:
        address:
          $ref: '#/components/schemas/Address'
    ChallengeResponse:
      type: object
      required: [challengeId, nonce, message, issuedAt, expiresAt]
      properties:
        challengeId:
          type: string
          format: uuid
          example: 3f2b8c1e-5d4a-4c7b-9a10-2e6f7d8c9b01
        nonce:
          type: string
          description: Random single-use value of 128 bits (32 hex characters) embedded in the message.
          example: 9c1d4f7a2b8e4d3f5a6b7c8d9e0f1a2b
        message:
          type: string
          description: >-
            EIP-4361 sign-in text. The wallet signs exactly this text as an EIP-191 personal
            message, without any change. Lines are separated by LF only.
          example: |-
            latifi.example wants you to sign in with your Ethereum account:
            0x52908400098527886E0F7030069857D2E4169EE7

            Sign in to LatiFi. This request does not trigger a blockchain transaction or cost any fee.

            URI: https://latifi.example
            Version: 1
            Chain ID: 80002
            Nonce: 9c1d4f7a2b8e4d3f5a6b7c8d9e0f1a2b
            Issued At: 2026-01-01T12:00:00Z
            Expiration Time: 2026-01-01T12:05:00Z
        issuedAt:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-01-01T12:05:00Z'
    VerifyRequest:
      type: object
      required: [challengeId, address, signature]
      properties:
        challengeId:
          type: string
          format: uuid
          example: 3f2b8c1e-5d4a-4c7b-9a10-2e6f7d8c9b01
        address:
          $ref: '#/components/schemas/Address'
        signature:
          type: string
          pattern: '^0x[0-9a-fA-F]{130}$'
          description: 65 byte signature (r, s and v) of the challenge message, as 0x hex.
          example: '0x1111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111'
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, address]
      properties:
        accessToken:
          type: string
          description: Session token to send as a bearer credential.
          example: eyJhbGciOiJIUzI1NiJ9.example.signature
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Lifetime of the token in seconds. It is 15 minutes and there is no refresh token.
          example: 900
        address:
          $ref: '#/components/schemas/Address'
    ContactType:
      type: string
      enum: [EMAIL, PHONE]
    Contact:
      type: object
      required: [type, value]
      properties:
        type:
          $ref: '#/components/schemas/ContactType'
        value:
          type: string
          minLength: 3
          maxLength: 254
          example: user@example.org
    ProfileUpdateRequest:
      type: object
      required: [displayName, contact]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          example: Sample User
        contact:
          $ref: '#/components/schemas/Contact'
    ProfileResponse:
      type: object
      required: [address, displayName, createdAt, updatedAt]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        displayName:
          type: string
          maxLength: 80
          example: Sample User
        contact:
          allOf:
            - $ref: '#/components/schemas/Contact'
          description: Present only when the caller owns the address.
        createdAt:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
    ReputationLevel:
      type: string
      description: >-
        Level on the score scale of 0 to 1000. NEW is 0 to 399, or any address without a scored
        chain signal. BUILDING is 400 to 599. TRUSTED is 600 to 799. EXCELLENT is 800 to 1000.
      enum: [NEW, BUILDING, TRUSTED, EXCELLENT]
    ReputationResponse:
      type: object
      required:
        - address
        - score
        - level
        - onTimeCount
        - lateCount
        - defaultCount
        - profileComplete
        - updatedAt
      properties:
        address:
          $ref: '#/components/schemas/Address'
        score:
          type: integer
          minimum: 0
          maximum: 1000
          description: Reputation score from 0 to 1000.
          example: 620
        level:
          $ref: '#/components/schemas/ReputationLevel'
        onTimeCount:
          type: integer
          minimum: 0
          description: Completed installments paid on time, counted from the indexed event log.
          example: 3
        lateCount:
          type: integer
          minimum: 0
          description: Completed installments paid late, counted from the indexed event log.
          example: 1
        defaultCount:
          type: integer
          minimum: 0
          description: Defaults taken from the indexed event log.
          example: 0
        profileComplete:
          type: boolean
          description: Whether the off-chain profile signal was counted.
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
    ReputationEventType:
      type: string
      enum: [PROFILE_COMPLETED, REPAID_ON_TIME, REPAID_LATE, DEFAULTED]
    ReputationEvent:
      type: object
      required: [id, type, delta, scoreAfter, occurredAt]
      properties:
        id:
          type: integer
          format: int64
          example: 41
        loanId:
          type: string
          nullable: true
          pattern: '^[0-9]{1,78}$'
          description: Loan that produced the event. Null for PROFILE_COMPLETED.
          example: '7'
        type:
          $ref: '#/components/schemas/ReputationEventType'
        delta:
          type: integer
          description: Effective change of the score, after the clamp to the range 0 to 1000.
          example: 20
        scoreAfter:
          type: integer
          minimum: 0
          maximum: 1000
          description: Score right after this event, on the scale of 0 to 1000.
          example: 620
        daysLate:
          type: integer
          nullable: true
          minimum: 0
          description: Days past the due date. Only set for REPAID_LATE and DEFAULTED.
        txHash:
          type: string
          nullable: true
          pattern: '^0x[0-9a-fA-F]{64}$'
          description: >-
            Transaction that emitted the source event. With logIndex it is the idempotency key.
            Null for PROFILE_COMPLETED, which has no transaction.
          example: '0x2222222222222222222222222222222222222222222222222222222222222222'
        logIndex:
          type: integer
          nullable: true
          minimum: 0
          description: Position of the source log in its transaction. Null for PROFILE_COMPLETED, which has no transaction.
          example: 0
        occurredAt:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
    ReputationHistoryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReputationEvent'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
    LoanStatus:
      type: string
      enum: [OPEN, ACTIVE, REPAID, DEFAULTED]
    BorrowerReputation:
      type: object
      required: [score, level]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 1000
          description: Reputation score of the borrower, from 0 to 1000.
          example: 620
        level:
          $ref: '#/components/schemas/ReputationLevel'
    LoanSummary:
      type: object
      required:
        - loanId
        - borrower
        - principal
        - interestRateBps
        - termDays
        - installments
        - status
        - amountRepaid
        - totalDue
        - installmentsPaid
        - requestedAt
        - borrowerReputation
      properties:
        loanId:
          $ref: '#/components/schemas/Uint256'
        borrower:
          $ref: '#/components/schemas/Address'
        lender:
          type: string
          nullable: true
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: Funding address. Null until the loan is funded.
          example: '0x3333333333333333333333333333333333333333'
        principal:
          $ref: '#/components/schemas/Uint256'
        interestRateBps:
          type: integer
          minimum: 1
          maximum: 5000
          description: Annual simple interest, in basis points (1 to 5000).
          example: 1000
        termDays:
          type: integer
          minimum: 1
          example: 30
        installments:
          type: integer
          minimum: 1
          maximum: 6
          description: Number of equal installments. 1 is a single payment.
          example: 3
        status:
          $ref: '#/components/schemas/LoanStatus'
        amountRepaid:
          $ref: '#/components/schemas/Uint256'
        totalDue:
          $ref: '#/components/schemas/Uint256'
        installmentsPaid:
          type: integer
          minimum: 0
          maximum: 6
          description: Number of fully paid installments.
          example: 1
        requestedAt:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
        fundedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the loan is funded.
          example: '2026-01-02T12:00:00Z'
        finalDueDate:
          type: string
          format: date-time
          nullable: true
          description: Due date of the last installment. Null until the loan is funded.
          example: '2026-02-01T12:00:00Z'
        nextDueDate:
          type: string
          format: date-time
          nullable: true
          description: Due date of the next unpaid installment. Null when none is pending.
          example: '2026-01-12T12:00:00Z'
        borrowerReputation:
          $ref: '#/components/schemas/BorrowerReputation'
    LoanPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoanSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: Total matches, used for the result counter of the app.
    ConvertResponse:
      type: object
      required: [amount, currency, value, rate, asOf, stale]
      properties:
        amount:
          $ref: '#/components/schemas/Uint256'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: PEN
        value:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: >-
            Converted value, rounded half-even to the fraction digits of the currency. CLP has
            none.
        rate:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Units of local currency per one US dollar.
        asOf:
          type: string
          format: date-time
          description: Instant of the rate that produced the value.
          example: '2026-01-01T12:00:00Z'
        stale:
          type: boolean
          description: True when the provider is down and the last cached rate was used.
    RateQuote:
      type: object
      required: [base, quote, rate, asOf, stale]
      properties:
        base:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Currency the stablecoin is priced in, US dollar.
          example: USD
        quote:
          type: string
          pattern: '^[A-Z]{3}$'
          example: PEN
        rate:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Units of local currency per one US dollar.
        asOf:
          type: string
          format: date-time
          example: '2026-01-01T12:00:00Z'
        stale:
          type: boolean
    RateList:
      type: array
      items:
        $ref: '#/components/schemas/RateQuote'
