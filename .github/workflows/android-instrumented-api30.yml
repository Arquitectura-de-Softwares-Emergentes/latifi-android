name: android-instrumented-api30

# Advisory workflow. It runs only LocaleSwitchTest on an API 30 emulator, which proves the
# per-app locale backport below API 33 (AppCompat stores the choice in
# AppLocalesMetadataHolderService). It must stay advisory and never join branch protection,
# because an emulator can be flaky. The required checks are `ci` and `commit-lint` only.
# The API 34 leg with every test is `android-instrumented`.
# workflow_dispatch only works once this file exists on the default branch.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - app/src/**
      - gradle/**
      - build.gradle.kts
      - app/build.gradle.kts
      - .github/workflows/android-instrumented-api30.yml
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumented-api30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-instrumented-api30:
    name: android-instrumented-api30
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the locale test on an API 30 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.latifi.wallet.LocaleSwitchTest

      - name: Upload instrumentation reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumented-api30-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
