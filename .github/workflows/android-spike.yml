name: android-spike

# Evidence run for ROADMAP Decision 1 (Keystore spike). Not a required check and it
# must never be added to branch protection: an emulator can be flaky.
# workflow_dispatch only works once this file exists on the default branch.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - app/src/androidTest/java/com/latifi/wallet/spike/KeystoreEnvelopeSpikeTest.kt
      - .github/workflows/android-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-spike:
    name: android-spike
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Keystore spike on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest && adb logcat -d -s KeystoreSpike:I | tee spike-logcat.txt

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-spike-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            spike-logcat.txt
          if-no-files-found: ignore
